<body>
<canvas id="game"></canvas>
<div id="safe" style="position:fixed;top:0;height:0;padding-top:env(safe-area-inset-top);pointer-events:none"></div>

<script>
/* ═══ BLOCK DROP BATTLE · a Multiplayer Agent starter ════════════════════════════════════
 * Clear lines to send junk to your rival. Versus, 2–4 players; bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ board size, speed, junk per clear, bots
 *   PIECES ........ the seven block shapes and their colors
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   BOARD ......... one board's rules: falling, rotating, locking, clearing, junk rows
 *   MATCH (HOST) .. countdown, who is still alive, the winner, the restart, the bots
 *   BOTS (HOST) ... a bot picks the best spot for each piece and steers it there
 *   ME ............ my board: input, gravity, sending junk, publishing
 *   DRAW .......... my board large, rivals small, effects
 *   SCREENS ....... hint, results, leaderboard
 *   INPUT ......... keyboard (with key repeat), tap and swipe
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player's board is its OWN entity: `b` = {m, r, p, n, a, l, s, q}: match id, the
 *     200 cells packed as one string ("." empty, a letter per block), the falling piece,
 *     the next piece, alive, lines cleared, lines sent, junk waiting. Also `n` (name), `c`
 *     (color) and `hb` (heartbeat).
 *   - The HOST (lowest live sessionId) runs the match in ONE shared field, `match`: {id, v,
 *     ph, seed, startAt, players, bots, out, winner, endsAt}. It reads every board, marks
 *     who topped out and calls the winner. Bots' boards live in the shared field `bots`.
 *   - Clearing 2+ lines sends junk with a "junk" event {to, n, hole}. The victim adds the
 *     junk rows to its OWN board when its next piece locks (a clear of its own cancels it).
 *   - Everyone gets the same piece order: a 7-piece bag shuffled from match.seed.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "lines-sent": each player's best match.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 4,             // bots fill the match up to this many boards (2–4)
  cols: 10, rows: 20,   // board size in cells
  gravityMs: 800,       // a piece falls one row this often at the start…
  speedUpEvery: 25000,  // …and gets faster every 25 seconds…
  speedUp: 0.8,         // …by this factor…
  minGravityMs: 90,     // …down to this
  lockMs: 500,          // a landed piece can still slide this long
  countdownMs: 3000,    // 3, 2, 1, go
  overMs: 9000,         // the results screen
  junk: [0, 0, 1, 2, 4], // junk rows sent for clearing 0, 1, 2, 3 or 4 lines at once
  botMoveMs: 140,       // a bot makes one move this often (lower is faster)
  botMistake: 0.15,     // chance a bot settles for a worse spot
  das: 160, arr: 45,    // key repeat: delay before it starts, then ms per step
  board: "lines-sent",  // leaderboard name
};
const BOT_NAMES = ["Blocky", "Tetra", "Stacker", "Gravity", "Linus", "Quad", "Brick", "Drop Bot"];
const COLORS = ["#ffd23f", "#4cc9f0", "#f72585", "#80ed99", "#ff9f1c", "#b388ff", "#ff6b6b", "#00f5d4"];

// ── PIECES ──────────────────────────────────────────────────────────────────────────
// Each shape is its cells in an n×n box; rotating turns the box. "G" is a junk block.
const PIECES = {
  I: { n: 4, cells: [[0, 1], [1, 1], [2, 1], [3, 1]], color: "#38d6f5" },
  O: { n: 2, cells: [[0, 0], [1, 0], [0, 1], [1, 1]], color: "#ffd23f" },
  T: { n: 3, cells: [[1, 0], [0, 1], [1, 1], [2, 1]], color: "#b467ff" },
  S: { n: 3, cells: [[1, 0], [2, 0], [0, 1], [1, 1]], color: "#4ee08a" },
  Z: { n: 3, cells: [[0, 0], [1, 0], [1, 1], [2, 1]], color: "#ff5a6e" },
  J: { n: 3, cells: [[0, 0], [0, 1], [1, 1], [2, 1]], color: "#4c7dff" },
  L: { n: 3, cells: [[2, 0], [0, 1], [1, 1], [2, 1]], color: "#ff9f1c" },
};
const BLOCK_COLOR = { ...Object.fromEntries(Object.entries(PIECES).map(([k, v]) => [k, v.color])), G: "#6b6788" };
const cellsOf = (t, r) => { let c = PIECES[t].cells; for (let i = 0; i < (((r % 4) + 4) % 4); i++) c = c.map(([x, y]) => [PIECES[t].n - 1 - y, x]); return c; };

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'block-drop-battle',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A JSON field (shared or a player's), parsed once per change. Read-only. */
function cached(key, raw, fb) { const m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fb); memo.set(key, { raw, v }); return v; }
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId));

// ── BOARD ───────────────────────────────────────────────────────────────────────────
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
/** The piece order: 7-piece bags shuffled from the match seed, the same for every board. */
function pieceBag(seed, skip = 0) {
  const r = mulberry32(seed);
  let q = [];
  const next = () => { if (!q.length) { q = Object.keys(PIECES); for (let i = q.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [q[i], q[j]] = [q[j], q[i]]; } } return q.shift(); };
  for (let i = 0; i < skip; i++) next();
  return next;
}
const emptyRow = () => Array(CONFIG.cols).fill(".");
const newBoard = (seed) => ({ grid: Array.from({ length: CONFIG.rows }, emptyRow), p: null, next: "", bag: pieceBag(seed), dealt: 0, alive: true, lines: 0, sent: 0, pending: 0, hole: 0, fallAt: 0, lockAt: 0, resets: 0 });
function fits(B, t, r, x, y) {
  for (const [cx, cy] of cellsOf(t, r)) {
    const gx = x + cx, gy = y + cy;
    if (gx < 0 || gx >= CONFIG.cols || gy >= CONFIG.rows || (gy >= 0 && B.grid[gy][gx] !== ".")) return false;
  }
  return true;
}
function deal(B) { B.dealt++; return B.bag(); }
function spawn(B) {
  const t = B.next || deal(B);
  B.next = deal(B);
  const x = t === "O" ? 4 : 3, y = t === "I" ? -1 : 0;
  B.lockAt = 0; B.resets = 0;
  if (fits(B, t, 0, x, y)) B.p = { t, r: 0, x, y }; else { B.p = null; B.alive = false; } // topped out
}
function shift(B, dx, dy) {
  const p = B.p;
  if (!p || !fits(B, p.t, p.r, p.x + dx, p.y + dy)) return false;
  p.x += dx; p.y += dy;
  if (B.lockAt && B.resets++ < 12) B.lockAt = 0; // sliding on the floor buys a little time
  return true;
}
function rotate(B, dir) {
  const p = B.p;
  if (!p) return false;
  for (const [kx, ky] of [[0, 0], [-1, 0], [1, 0], [-2, 0], [2, 0], [0, -1]]) { // wall kicks
    if (fits(B, p.t, p.r + dir, p.x + kx, p.y + ky)) { p.r = (p.r + dir + 4) % 4; p.x += kx; p.y += ky; if (B.lockAt && B.resets++ < 12) B.lockAt = 0; return true; }
  }
  return false;
}
const dropY = (B) => { let y = B.p.y; while (fits(B, B.p.t, B.p.r, B.p.x, y + 1)) y++; return y; };
/** Gravity and the lock timer. Returns what locking did, or null. */
function stepBoard(B, now, gravity) {
  if (!B.alive || !B.p) return null;
  if (fits(B, B.p.t, B.p.r, B.p.x, B.p.y + 1)) { B.lockAt = 0; if (now >= B.fallAt) { B.p.y++; B.fallAt = now + gravity; } return null; }
  if (!B.lockAt) B.lockAt = now + CONFIG.lockMs;
  return now >= B.lockAt ? lockPiece(B) : null;
}
function hardDrop(B) { if (!B.p) return null; B.p.y = dropY(B); return lockPiece(B); }
/** Lock the piece, clear full rows, settle junk, spawn the next one. Returns {cleared, send, rows}. */
function lockPiece(B) {
  const { t, r, x, y } = B.p;
  for (const [cx, cy] of cellsOf(t, r)) { if (y + cy < 0) { B.alive = false; B.p = null; return { cleared: 0, send: 0, rows: [] }; } B.grid[y + cy][x + cx] = t; }
  const rows = B.grid.map((row, i) => (row.every((c) => c !== ".") ? i : -1)).filter((i) => i >= 0);
  B.grid = B.grid.filter((_, i) => !rows.includes(i));
  while (B.grid.length < CONFIG.rows) B.grid.unshift(emptyRow());
  let send = CONFIG.junk[rows.length] || 0;
  if (rows.length) { const cancel = Math.min(B.pending, send || rows.length); B.pending -= cancel; send = Math.max(0, send - cancel); }
  else if (B.pending) { addJunk(B, B.pending, B.hole); B.pending = 0; }
  B.lines += rows.length; B.sent += send; B.p = null;
  if (B.alive) spawn(B);
  return { cleared: rows.length, send, rows };
}
/** Push junk rows in from the bottom (one gap per attack). Blocks pushed off the top = out. */
function addJunk(B, n, hole) {
  for (let i = 0; i < n; i++) {
    if (B.grid[0].some((c) => c !== ".")) B.alive = false;
    B.grid.shift();
    const row = Array(CONFIG.cols).fill("G"); row[hole] = ".";
    B.grid.push(row);
  }
}
/** A board as it goes on the wire: one short JSON string. */
const packBoard = (B, m) => JSON.stringify({ m, r: B.grid.map((row) => row.join("")).join(""), p: B.p ? [B.p.t, B.p.r, B.p.x, B.p.y] : 0, n: B.next, a: B.alive ? 1 : 0, l: B.lines, s: B.sent, q: B.pending });
const gravityAt = (m, now) => Math.max(CONFIG.minGravityMs, CONFIG.gravityMs * CONFIG.speedUp ** Math.floor(Math.max(0, now - m.startAt) / CONFIG.speedUpEvery));

// ── MATCH (HOST) ────────────────────────────────────────────────────────────────────
const host = { last: null, was: false, bots: new Map(), botsRaw: "", lastBots: 0 };
function match() {
  const m = parse(S.shared.match, null);
  return host.last && isHost() && (!m || host.last.v > m.v) ? host.last : m;
}
function writeMatch(m) { m = { ...m, v: (match()?.v ?? 0) + 1 }; host.last = m; net.setShared("match", JSON.stringify(m)); return m; }
const nameOf = (m, id) => (id === net.sessionId ? myName : m?.bots.find((b) => b.i === id)?.n) || String(S.entities.players?.[id]?.n ?? "Player").slice(0, 12);
const colorOf = (m, id) => (id === net.sessionId ? myColor : m?.bots.find((b) => b.i === id)?.c) || S.entities.players?.[id]?.c || "#aaa";
const isBot = (m, id) => !!m && m.bots.some((b) => b.i === id);

function newMatch(id) {
  const hs = humans().slice(0, 4), used = new Set(hs.map((h) => colorOf(null, h))), free = COLORS.filter((c) => !used.has(c)), names = [...BOT_NAMES].sort(() => Math.random() - 0.5);
  const bots = Array.from({ length: Math.max(hs.length ? 0 : 1, CONFIG.seats - hs.length) }, (_, k) => ({ i: "bot" + (k + 1), n: names[k], c: free[k % free.length] }));
  const seed = (Math.random() * 1e9) | 0;
  host.bots = new Map(bots.map((b) => [b.i, { B: newBoard(seed), plan: null, nextAt: 0 }]));
  return { id, ph: "count", seed, startAt: Date.now() + CONFIG.countdownMs, players: [...hs, ...bots.map((b) => b.i)], bots, out: [], winner: "", endsAt: 0, ready: [] };
}
/** Become host: take the bots' boards over exactly as state has them. */
function adopt() {
  host.was = true; host.last = null; host.bots = new Map();
  const m = match();
  if (!m) return;
  for (const v of cached("bots", S.shared.bots, [])) {
    const B = boardFromView(v, m.seed);
    B.bag = pieceBag(m.seed, v.k || 0); B.dealt = v.k || 0;
    host.bots.set(v.i, { B, plan: null, nextAt: 0 });
  }
  for (const b of m.bots) if (!host.bots.has(b.i)) host.bots.set(b.i, { B: newBoard(m.seed), plan: null, nextAt: 0 });
}
function boardFromView(v, seed) {
  const B = newBoard(seed);
  if (typeof v.r === "string") B.grid = Array.from({ length: CONFIG.rows }, (_, y) => [...v.r.slice(y * CONFIG.cols, (y + 1) * CONFIG.cols).padEnd(CONFIG.cols, ".")]);
  B.p = v.p ? { t: v.p[0], r: v.p[1], x: v.p[2], y: v.p[3] } : null;
  Object.assign(B, { next: v.n || "", alive: !!v.a, lines: v.l || 0, sent: v.s || 0, pending: v.q || 0 });
  return B;
}
function hostTick(now) {
  if (!host.was) adopt();
  let m = match();
  if (!m) m = writeMatch(newMatch(1));
  if (m.ph === "count" && now >= m.startAt) m = writeMatch({ ...m, ph: "play" });
  if (m.ph === "play") { botsTick(m, now); checkOuts(match(), now); }
  else if (m.ph === "over" && now >= m.endsAt) writeMatch(newMatch(m.id + 1));
  writeBots();
}
/** Who is out: topped-out boards and players who left. One survivor wins; none is a draw. */
function checkOuts(m, now) {
  const ps = S.entities.players || {}, live = new Set(livePlayers());
  const gone = m.players.filter((id) => {
    if (m.out.includes(id)) return false;
    if (isBot(m, id)) return !host.bots.get(id)?.B.alive;
    if (id === net.sessionId) return me.B && me.m === m.id && !me.B.alive;
    const b = cached("b:" + id, ps[id]?.b, null);
    return !live.has(id) || (b && b.m === m.id && !b.a); // left, frozen (no heartbeat for 3s) or topped out
  });
  if (!gone.length) return;
  const out = [...m.out, ...gone], alive = m.players.filter((id) => !out.includes(id));
  if (alive.length <= (m.players.length > 1 ? 1 : 0)) writeMatch({ ...m, out, ph: "over", winner: alive[0] || "", endsAt: now + CONFIG.overMs, ready: [] });
  else writeMatch({ ...m, out });
}
function onReady(from) {
  const m = match();
  if (!m || m.ph !== "over" || m.ready.includes(from)) return;
  const ready = [...m.ready, from];
  writeMatch({ ...m, ready, endsAt: humans().every((id) => ready.includes(id)) ? Math.min(m.endsAt, Date.now() + 1200) : m.endsAt });
}
/** Send junk to a random rival who is still in. */
function attack(m, from, n) {
  const rivals = m.players.filter((id) => id !== from && !m.out.includes(id));
  if (!rivals.length || n <= 0) return;
  const to = rivals[Math.floor(Math.random() * rivals.length)], hole = Math.floor(Math.random() * CONFIG.cols);
  fx.attacks.push({ from, to, n, at: performance.now() });
  receiveJunk(m, to, n, hole);
  if (to !== net.sessionId && !(isHost() && host.bots.has(to))) net.send("junk", { to, n, hole, m: m.id, f: from });
}
/** Junk lands on my board, or (as host) on a bot's. It waits until that board's next lock. */
function receiveJunk(m, to, n, hole) {
  const B = to === net.sessionId ? (me.m === m.id ? me.B : null) : isHost() ? host.bots.get(to)?.B : null;

}

// ── BOTS (HOST) ─────────────────────────────────────────────────────────────────────
/** Score a spot: low, flat stacks without holes, and cleared lines, are good. */
function scoreSpot(B, t, r, x, y) {
  const g = B.grid.map((row) => row.slice());
  for (const [cx, cy] of cellsOf(t, r)) if (y + cy >= 0) g[y + cy][x + cx] = t;
  const kept = g.filter((row) => row.some((c) => c === ".")), lines = CONFIG.rows - kept.length;
  while (kept.length < CONFIG.rows) kept.unshift(emptyRow());
  let agg = 0, holes = 0, bump = 0, prev = -1;
  for (let c = 0; c < CONFIG.cols; c++) {
    let h = 0, seen = false;
    for (let rr = 0; rr < CONFIG.rows; rr++) { if (kept[rr][c] !== ".") { if (!seen) { h = CONFIG.rows - rr; seen = true; } } else if (seen) holes++; }

/** One step toward the planned spot: rotate, then slide, then drop. Returns a lock result or null. */
function steerBot(bot, now) {

  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  net.on("junk", (msg, from) => { const m = match(); if (msg && m && msg.m === m.id) { fx.attacks.push({ from: msg.f || from, to: msg.to, n: msg.n, at: performance.now() }); receiveJunk(m, msg.to, Math.min(8, msg.n | 0), Math.abs(msg.hole | 0) % CONFIG.cols); } });
  net.on("ready", (msg, from) => { if (isHost()) onReady(from); });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...(match()?.bots || []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) { // the preview starts mid-match: half-full boards, so lines clear and junk flies at once
    const m = writeMatch(newMatch(1));
    for (const [id, bot] of host.bots) for (let y = id === "bot1" ? 16 : 11; y < CONFIG.rows; y++) { const hole = Math.floor(Math.random() * CONFIG.cols); bot.B.grid[y] = bot.B.grid[y].map((_, x) => (x === hole || Math.random() < 0.12 ? "." : "G")); }
    host.lastBots = 0; writeBots(); void m;
    adopt(); host.bots.get("bot1").mistake = 0.04; // the big board in the preview plays a little better
  }
  requestAnimationFrame(frame);
})();
</script>
